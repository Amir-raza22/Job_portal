<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recruiter Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">

        <h2>Job Portal</h2>
        
        <div>
        
            <button id="homeBtn">
                Home
            </button>
        
            <button id="logoutBtn">
                Logout
            </button>
        
        </div>
    
    </nav>


    <main class="dashboard-container">

        <h1>Recruiter Dashboard</h1>


        <!-- Create Job -->

        <section>

            <h2>Create New Job</h2>

            <form id="jobForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Job Title"
                    required
                >

                <input
                    type="text"
                    id="company"
                    placeholder="Company"
                    required
                >

                <input
                    type="text"
                    id="location"
                    placeholder="Location"
                    required
                >

                <input
                    type="number"
                    id="salary"
                    placeholder="Salary"
                >

                <textarea
                    id="description"
                    placeholder="Job Description"
                    required
                ></textarea>

                <button type="submit">
                    Create Job
                </button>

            </form>

            <p id="message"></p>

        </section>


        <!-- My Jobs -->

        <section>
            <h2>My Jobs</h2>
            <div id="jobsList">
                Loading jobs...
            </div>
        </section>
    </main>


    <script src="js/recruiter-dashboard.js"></script>

</body>

</html>
